<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>Luster</title>
    <meta name="description" content="Turn an SVG into a 3D enamel badge, in your browser, and export it as a GLB.">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/src/style.css">
    <script type="module" src="/src/main.js"></script>
  </head>
  <body>
    <header class="title">
      <h1 class="name">LUSTER</h1>
      <a class="source" href="https://github.com/famio/Luster" data-text="source">Source</a>
    </header>
    <main>
      <section class="stage" id="stage">
        <luster-view id="view" role="img"><span class="spinner" aria-hidden="true"></span></luster-view>
        <p class="placeholder" id="placeholder" data-text="placeholder"></p>
        <div class="bottom">
          <span class="file" id="file"></span>
          <button class="open" id="open" data-text="open"></button>
          <input type="file" id="pick" accept=".svg,image/svg+xml" hidden>
        </div>
        <div class="veil" id="veil"><span data-text="drop"></span></div>
      </section>
      <aside class="sidebar">
        <section>
          <h2 id="metal-title" data-text="metal"></h2>
          <div class="choices" role="radiogroup" aria-labelledby="metal-title">
            <label><input type="radio" autocomplete="off" name="metal" value="gold" checked><span data-text="gold"></span></label>
            <label><input type="radio" autocomplete="off" name="metal" value="silver"><span data-text="silver"></span></label>
            <label><input type="radio" autocomplete="off" name="metal" value="copper"><span data-text="copper"></span></label>
          </div>
        </section>
        <section>
          <h2 data-text="lighting"></h2>
          <label><input type="checkbox" autocomplete="off" switch id="shine" checked><span data-text="shine"></span></label>
        </section>
        <section>
          <h2 data-text="lines"></h2>
          <label><input type="checkbox" autocomplete="off" switch id="metal-lines"><span data-text="metalLines"></span></label>
        </section>
        <section class="end">
          <button class="export primary" id="export" disabled data-text="export"></button>
        </section>
      </aside>
    </main>
    <dialog id="alert" aria-labelledby="alert-title" aria-describedby="alert-message">
      <form method="dialog">
        <h3 id="alert-title"></h3>
        <p id="alert-message"></p>
        <button class="primary" value="ok" data-text="ok"></button>
      </form>
    </dialog>
  </body>
</html>
