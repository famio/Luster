<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- A square shaded red at the top to blue at the bottom, with a flat white disc on it. -->
  <defs>
    <linearGradient id="g" x1="0" y1="10" x2="0" y2="90" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF0000"/><stop offset="1" stop-color="#0000FF"/>
    </linearGradient>
  </defs>
  <rect x="10" y="10" width="80" height="80" fill="url(#g)"/>
  <circle cx="50" cy="50" r="12" fill="#FFFFFF"/>
</svg>
