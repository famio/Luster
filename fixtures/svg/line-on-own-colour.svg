<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- A stroke on a fill of its own colour, under a glaze. -->
  <rect x="20" y="20" width="60" height="30" fill="#FFFFFF"/>
  <path fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"
        d="M10,70 L50,45"/>
  <rect x="20" y="20" width="60" height="30" fill="#FF0000" fill-opacity="0.6"/>
</svg>

