name: Release

# Nothing here runs on its own. A release is started by hand, and even then it
# only builds and checks: it publishes when someone asks it to, by setting
# `publish` to true.
#
# Scripts/release.sh prepares the tag beforehand: it sets the version
# everywhere, packs the XCFrameworks and writes their URLs and checksums into
# Package.swift and the Flutter plugin's. Those zips are attached by hand to a
# draft release. The engine does not build to the same bytes twice (xcodebuild
# orders the slices as it likes and the archives carry the time they were
# made), so rather than build them again this checks the zips the draft
# carries: that they are the ones the tag names, and that the packages build
# and pass their tests linked against them.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "The tag to release (e.g. 0.2.0). It must already exist."
        required: true
        type: string
      publish:
        description: "Take the draft release public and publish the AARs to Maven Central"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  apple:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version }}
      - run: rustup show active-toolchain || rustup toolchain install
        working-directory: rust

      - name: A tag may not point at a local engine
        run: |
          if grep -q 'path: "rust/target/apple' Package.swift ||
             grep -q 'path: "luster_dart.xcframework"' flutter/luster/darwin/luster/Package.swift; then
            echo "a Package.swift still points at the local XCFramework;" \
                 "run Scripts/release.sh before tagging" >&2
            exit 1
          fi

      - name: The draft's zips are the ones the Package.swift files were tagged with
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for pair in LusterFFI:Package.swift luster_dart:flutter/luster/darwin/luster/Package.swift; do
            zip="${pair%%:*}.xcframework.zip"
            manifest="${pair#*:}"
            gh release download "${{ inputs.version }}" --pattern "$zip" --dir "$RUNNER_TEMP"
            attached=$(swift package compute-checksum "$RUNNER_TEMP/$zip")
            tagged=$(grep -o 'checksum: "[0-9a-f]*"' "$manifest" | cut -d'"' -f2)
            echo "$zip attached $attached"
            echo "$zip tagged   $tagged"
            [ "$attached" = "$tagged" ] || {
              echo "the release's $zip is not the one $manifest names" >&2
              exit 1
            }
          done

      # The tests run against that zip, unpacked where a checkout's own build
      # would be. The bindings are the ones committed with the tag.
      - name: Link the package against the draft's engine
        run: |
          mkdir -p rust/target/apple
          unzip -q "$RUNNER_TEMP/LusterFFI.xcframework.zip" -d rust/target/apple
          python3 - <<'PY'
          import re
          p = 'Package.swift'
          s = open(p).read()
          s = re.sub(r'let ffi: Target = \.binaryTarget\((?:[^)]*)\)',
                     'let ffi: Target = .binaryTarget(\n    name: "LusterFFI",\n'
                     '    path: "rust/target/apple/LusterFFI.xcframework"\n)', s, count=1)
          open(p, 'w').write(s)
          PY
      - run: swift test
      - run: Scripts/parity.sh

  android:
    # The AAR is published only once the Apple side has checked out.
    needs: apple
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version }}
      - run: rustup show active-toolchain || rustup toolchain install
        working-directory: rust
      - run: cargo install cargo-ndk
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: Scripts/build-android.sh release
      # Signed even when nothing is published, so a check run shows that the
      # key in the secrets works.
      - name: Build and sign the AARs
        working-directory: android
        env:
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew :luster:publishToMavenLocal :luster-compose:publishToMavenLocal
      - name: Publish the AARs to Maven Central
        if: ${{ inputs.publish }}
        working-directory: android
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew :luster:publishAndReleaseToMavenCentral :luster-compose:publishAndReleaseToMavenCentral

  flutter:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version }}
      - run: rustup show active-toolchain || rustup toolchain install
        working-directory: rust
      - uses: subosito/flutter-action@v2
        with:
          # What flutter/luster/.fvmrc pins.
          flutter-version: 3.47.5
      # pub.dev is never published to from here: the last step is a person's,
      # `dart pub publish` from flutter/luster. This says what it would say.
      # A warning makes the dry run exit 65. One stays on purpose: the runtime
      # refuses any flutter_rust_bridge but the one the bindings were made with,
      # so pubspec.yaml pins it. Any other warning, or an error, fails here.
      - name: What pub.dev would say
        working-directory: flutter/luster
        run: |
          flutter pub get
          flutter analyze
          status=0
          flutter pub publish --dry-run > "$RUNNER_TEMP/pub" 2>&1 || status=$?
          cat "$RUNNER_TEMP/pub"
          [ "$status" = 0 ] || {
            [ "$status" = 65 ] &&
              grep -q '^Package has 1 warning\.$' "$RUNNER_TEMP/pub" &&
              grep -q 'dependency on "flutter_rust_bridge" should allow more than one version' "$RUNNER_TEMP/pub"
          }
      # The example builds against the draft's engine, unpacked where a
      # checkout's own build would be, as the Swift package's tests do.
      - name: The example builds against the draft's engine
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ inputs.version }}" \
            --pattern luster_dart.xcframework.zip --dir "$RUNNER_TEMP"
          cd flutter/luster/darwin/luster
          unzip -q "$RUNNER_TEMP/luster_dart.xcframework.zip"
          python3 - <<'PY'
          import re
          p = 'Package.swift'
          s = open(p).read()
          s, n = re.subn(r'let engine: Target = \.binaryTarget\((?:[^)]*)\)',
                         'let engine: Target = .binaryTarget(\n    name: "luster_dart",\n'
                         '    path: "luster_dart.xcframework"\n)', s, count=1)
          assert n == 1, p
          open(p, 'w').write(s)
          PY
          # Every slice the zip carries: macOS, the simulator and a device.
          cd ../../example
          flutter build macos --debug
          flutter build ios --simulator --debug
          flutter build ios --debug --no-codesign

  # The draft goes public only once both packages have built against its zips.
  publish:
    if: ${{ inputs.publish }}
    needs: [apple, flutter]
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${{ inputs.version }}" --draft=false --repo "${{ github.repository }}"

  # The Flutter plugin's engine for Android, built for every target it runs on
  # and signed, so an app without Rust needs no Rust: cargokit takes the files
  # for the crate's hash from a precompiled_<hash> prerelease and checks them
  # against the key in rust/crates/luster-dart/cargokit.yaml. A hash that is
  # already there is skipped. This runs before `dart pub publish`, which is by
  # hand. On iOS and macOS the engine is the release's luster_dart zip instead.
  flutter-binaries:
    if: ${{ inputs.publish }}
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
      # Flutter's own defaults, the NDK and minimum SDK an app builds with.
      - name: Install the NDK
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;28.2.13676358"
      - name: Build, sign and upload
        working-directory: flutter/luster/cargokit/build_tool
        env:
          PRIVATE_KEY: ${{ secrets.CARGOKIT_PRIVATE_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          dart pub get
          # An Android debug build asks for i686 too, and one missing target
          # sends cargokit back to building every one from source.
          args=""
          for t in armv7-linux-androideabi aarch64-linux-android i686-linux-android x86_64-linux-android; do
            args="$args --target=$t"
          done
          args="$args --android-sdk-location=$ANDROID_HOME"
          args="$args --android-ndk-version=28.2.13676358 --android-min-sdk-version=24"
          dart run build_tool precompile-binaries --repository=${{ github.repository }} \
            --manifest-dir=../../rust/crates/luster-dart $args

  flutter-binaries-check:
    needs: flutter-binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
      # verify-binaries goes through every target cargokit knows, Windows and
      # Linux too; the plugin's own are the ones that have to be there.
      - name: Every target is there, signed with the key
        working-directory: flutter/luster/cargokit/build_tool
        run: |
          dart pub get
          dart run build_tool verify-binaries --manifest-dir=../../rust/crates/luster-dart \
            | tee "$RUNNER_TEMP/verify"
          for t in armv7-linux-androideabi aarch64-linux-android \
                   i686-linux-android x86_64-linux-android; do
            grep -Eq "^Checking $t\.\.\. *OK$" "$RUNNER_TEMP/verify" || {
              echo "no signed build for $t" >&2
              exit 1
            }
          done
