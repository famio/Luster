# The platform's maths library rounds as it likes; the engine's badges have to
# come out the same bytes everywhere. luster-core calls libm through its
# `math` module instead (sqrt is exact everywhere and stays).
disallowed-methods = [
    { path = "f32::sin", reason = "use crate::math::sin" },
    { path = "f32::cos", reason = "use crate::math::cos" },
    { path = "f32::tan", reason = "use crate::math::tan" },
    { path = "f32::sin_cos", reason = "use libm::sincosf" },
    { path = "f32::asin", reason = "use libm" },
    { path = "f32::acos", reason = "use crate::math::acos" },
    { path = "f32::atan", reason = "use crate::math::atan" },
    { path = "f32::atan2", reason = "use crate::math::atan2" },
    { path = "f32::exp", reason = "use crate::math::exp" },
    { path = "f32::ln", reason = "use libm" },
    { path = "f32::log2", reason = "use crate::math::log2" },
    { path = "f32::log10", reason = "use libm" },
    { path = "f32::powf", reason = "use crate::math::powf" },
    { path = "f32::hypot", reason = "use crate::math::hypot" },
    { path = "f32::cbrt", reason = "use libm" },
    { path = "f64::sin", reason = "use crate::math::sin" },
    { path = "f64::cos", reason = "use crate::math::cos" },
    { path = "f64::tan", reason = "use crate::math::tan" },
    { path = "f64::sin_cos", reason = "use libm::sincos" },
    { path = "f64::asin", reason = "use libm" },
    { path = "f64::acos", reason = "use crate::math::acos" },
    { path = "f64::atan", reason = "use crate::math::atan" },
    { path = "f64::atan2", reason = "use crate::math::atan2" },
    { path = "f64::exp", reason = "use crate::math::exp" },
    { path = "f64::ln", reason = "use libm" },
    { path = "f64::log2", reason = "use crate::math::log2" },
    { path = "f64::log10", reason = "use libm" },
    { path = "f64::powf", reason = "use crate::math::powf" },
    { path = "f64::hypot", reason = "use crate::math::hypot" },
    { path = "f64::cbrt", reason = "use libm" },
    { path = "kurbo::Vec2::hypot", reason = "use crate::math::length" },
    { path = "kurbo::Vec2::length", reason = "use crate::math::length" },
    { path = "kurbo::Point::distance", reason = "use crate::math::length" },
]
