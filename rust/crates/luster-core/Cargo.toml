[package]
name = "luster-core"
description = "Turns SVG artwork into a lit, minted 3D badge: pure Rust, no FFI types."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
usvg = { version = "0.48.1", default-features = false }
lyon_tessellation = "1.0.22"
thiserror = "2"
libm = "0.2.16"
i_overlay = { version = "9", features = ["allow_multithreading"] }
kurbo = "0.13"
tiny-skia = "0.12"
rayon = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif"] }
png = "0.17"

[dev-dependencies]
serde_json = "1"
